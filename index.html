<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Curta Nossa Página</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1877F2, #42A5F5);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            max-width: 450px;
            box-shadow: 0 10px 30px rgba(0,0,0,.2);
        }

        h1 {
            color: #1877F2;
            margin-bottom: 15px;
        }

        p {
            color: #555;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        .btn {
            display: inline-block;
            background: #1877F2;
            color: white;
            text-decoration: none;
            padding: 15px 35px;
            border-radius: 50px;
            font-size: 18px;
            transition: .3s;
        }

        .btn:hover {
            background: #0d5ddf;
            transform: scale(1.05);
        }

        .footer {
            margin-top: 20px;
            color: #888;
            font-size: 13px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>👍 Curta Nossa Página</h1>

    <p>
        Acompanhe novidades, promoções e conteúdos exclusivos.
        Clique no botão abaixo e deixe sua curtida!
    </p>

    <a class="btn" href="https://facebook.com/suapagina" target="_blank">
        Curtir Agora
    </a>

    <div class="footer">
        Obrigado pelo seu apoio ❤️
    </div>
</div>

</body>
</html>
